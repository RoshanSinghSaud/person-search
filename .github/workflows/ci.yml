name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:          # redeploy main by hand (Actions -> CI -> Run workflow)
    inputs:
      sync_secrets:
        description: "Rewrite the Space's secrets (after rotating a token or the API key)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  # a new commit cancels a PR's stale run, never a run on main that may be deploying
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"        # same uv that wrote uv.lock
          enable-cache: true

      - name: Install Python 3.10 + locked deps (CPU torch, API)
        run: |
          uv python install 3.10
          uv sync --group dev --group serve --frozen

      - name: Lint
        run: |
          uv run ruff check src tests tools scripts
          uv run ruff format --check src tests tools scripts

      - name: Type check
        run: uv run mypy

      - name: API contract tests
        # FastAPI app + real IndexedSearch over both index backends, fake models
        # (tests/unit/test_api.py). Runs first so a broken contract is named as such.
        run: uv run pytest tests/unit/test_api.py -v

      - name: Unit tests
        # parity/golden tests need the legacy repos + weights; they run locally
        # (make parity / make golden) and in the Day 24 eval-gate workflow.
        run: uv run pytest tests/unit --cov --cov-report=term-missing:skip-covered

  docker:
    name: docker image (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (linux/amd64, the server's platform)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: person-search:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: CPU-only torch, every runtime import works
        run: |
          docker run --rm --network none person-search:ci python -c "
          import torch, cv2, onnxruntime, ultralytics, qdrant_client
          from person_search.api.app import create_app
          from person_search.assets import load_manifest
          assert torch.version.cuda is None, torch.__version__
          load_manifest('/app/configs/assets.yaml')
          print('torch', torch.__version__, 'cv2', cv2.__version__)"

      - name: Without the assets or a way to fetch them, the container stops with a clear error
        # The weights and index download at start (decision 0013); here there is no
        # network and no HF token, so the start must fail fast (exit 2, naming the
        # setting to check), not hang or crash-loop silently.
        run: |
          set +e
          docker run --rm --network none person-search:ci > start.log 2>&1
          code=$?
          set -e
          cat start.log
          test "$code" -eq 2
          grep -q "PS_ASSETS__REPO" start.log

      - name: Image size
        run: docker image ls person-search:ci

  deploy:
    name: deploy to the Hugging Face Space
    # every push to main (= every merged PR), once the tests and the image build pass.
    # Off until the repository variable DEPLOY_SPACE is "true": since July 2026 Hugging
    # Face only runs Docker Spaces for PRO accounts (decision 0015, "Parked").
    needs: [checks, docker]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && vars.DEPLOY_SPACE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: deploy-space
      cancel-in-progress: false
    environment:
      name: huggingface-space
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"

      - name: Upload to the Space, wait for its build, check /health, search, upload key
        # decision 0015; scripts/deploy_space.py says what each setting is for.
        # huggingface_hub pinned to the version in uv.lock, without installing torch.
        id: deploy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
          PS_API_KEY: ${{ secrets.PS_API_KEY }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          PS_ASSETS__REPO: ${{ vars.PS_ASSETS_REPO }}
        run: >
          uv run --no-project --python 3.10 --with huggingface_hub==2.4.0
          python scripts/deploy_space.py
          ${{ inputs.sync_secrets && '--sync-secrets' || '' }}
