# Text test set (Day 9): witness-style descriptions of each test case's target.
#
# Leakage rule: every description was written from the case's query.jpg ONLY,
# before any text search was run on any video, and committed on its own before
# the first text query. Do not edit a description after looking at results;
# add a new one with a new id instead, and say so in the commit message.
#
# Three levels per target, the way a witness might report it:
#   short    - what someone remembers at a glance (2-3 attributes)
#   medium   - a typical report (4-5 attributes)
#   detailed - a careful report (6+ attributes)
#
# All descriptions fit in IRRA's 77-token context with the 8 prompt tokens
# (AUDIT.md F15); tests/unit/test_text_queries.py checks the format.

