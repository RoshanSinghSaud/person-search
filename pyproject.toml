[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "person-search"
version = "0.1.0"
description = "Photo + text person search over indexed video: YOLO11n + DeepSORT ingest, OSNet (photo) and IRRA (text) retrieval."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Roshan S. Saud" }]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Private :: Do Not Upload",
]
# Runtime: the inference stack shared by ingest, search and evaluation.
# Everything that changes a number in the golden test is pinned exactly to the
# versions the golden frames were verified with: repo 2's pins (torch 2.5.0 CPU,
# numpy 1.26.4, opencv 4.10.0.84, pillow 10.3.0, scipy 1.13.1) plus
# ultralytics 8.4.22, which the YOLO11 weights were saved with (AUDIT.md F10).
# Bumping any of them needs `make golden` and a decision note.
dependencies = [
    "numpy==1.26.4",
    "opencv-python==4.10.0.84",
    "pillow==10.3.0",                    # PIL resize feeds both encoders
    "scipy==1.13.1",                     # DeepSORT's assignment solver
    "torch==2.5.0",
    "torchvision==0.20.0",
    "ultralytics==8.4.22",
    "deep-sort-realtime==1.3.2",
    "setuptools<81",                     # deep-sort-realtime 1.3.2 imports pkg_resources
    "clip @ git+https://github.com/openai/CLIP.git@d05afc436d78f1c48dc0dbf8e5980a9d471f35f6",
    "ftfy>=6.1",                         # CLIP tokenizer
    "regex>=2023.0",                     # CLIP tokenizer
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6.0",
    "huggingface-hub>=0.23",
    "qdrant-client>=1.10",               # the vector index (local mode needs no server)
    "onnxruntime>=1.18,<1.24",           # INT8 image tower; 1.24 dropped Python 3.10 wheels
]

[project.scripts]
person-search = "person_search.cli:main"

[dependency-groups]
# API, queue, vector store, metrics (Weeks 2-3). Filled in as those days land.
serve = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "rq>=1.16",
    "prometheus-client>=0.20",
]
# Evaluation, experiment tracking, gate set access (Week 2 / Day 24): make eval-models, make register.
eval = [
    "mlflow>=2.14",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "onnx>=1.16",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.17,<0.18",
    "pre-commit>=3.7",
    "mypy>=1.10",
    "gdown>=5.2",                        # fetch Drive weights (scripts/fetch_weights.py)
    "torchreid==0.2.5",                  # parity tests only: the legacy OSNet path
    "tensorboard>=2.16",                 # imported by torchreid at import time
    "onnx>=1.16",                        # export + quantization tests (tests/unit/test_onnx_image.py)
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/person_search"]

# ---------------------------------------------------------------- uv
[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "tools"]
extend-exclude = ["src/person_search/models/osnet.py"]   # vendored verbatim (MIT)

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "PL", "NPY"]
ignore = [
    "PLR0913",   # encoders/pipelines legitimately take many settings
    "PLR2004",   # magic numbers are fine in tests and tensor shapes
    "PLR0917",   # keyword-heavy signatures are clearer than parameter objects here
    "PLC0415",   # deliberate lazy imports keep torch/CLIP/ultralytics off the CLI start-up path
    "N812",      # `functional as F` is the torch convention
    "RUF001",
    "RUF002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "N802", "N806"]
"src/person_search/eval/reid.py" = ["N815"]   # mAP is the field's own spelling
"tools/legacy/**" = ["PLR0915", "PLR0912", "PLW0603"]
"scripts/**" = ["PLR0915", "PLR0912"]          # linear run scripts: one long main() reads best

[tool.ruff.lint.isort]
known-first-party = ["person_search"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Import from src/ directly, so tests do not depend on the editable-install .pth
# (macOS can hide it; see README "Troubleshooting").
pythonpath = ["src", "."]
markers = [
    "parity: numerical parity against the legacy repos (needs legacy/ checkout + weights)",
    "golden: end-to-end characterization tests on the 4 test cases (needs videos + weights)",
    "slow: anything that takes more than a few seconds",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:pkg_resources is deprecated:UserWarning",
    "ignore::torch.jit.TracerWarning",   # torch.onnx.export traces CLIP's attention
    "ignore:.*weights_only=False.*:FutureWarning",
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
files = ["src/person_search"]
plugins = ["pydantic.mypy"]
exclude = ["src/person_search/models/osnet\\.py"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.coverage.run]
source = ["person_search"]
omit = ["src/person_search/models/osnet.py"]
