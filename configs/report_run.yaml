# Repo 2 (pole/reid_main.py) as committed: the final code of the published
# system. The golden test pins this configuration (exact legacy parity on all
# 4 test cases); it finds the target in 4/4 cases at 84.70% frame F1.
# No single setting reproduces all 4 committed output videos (AUDIT.md F5,
# section 5; decision 0002). These are also the code defaults in config.py.
detector:
  weights: models/yolo11n_person.pt
  confidence: 0.4
  resize_width: 640
tracker:
  max_age: 30
  n_init: 3
  max_iou_distance: 0.7
  max_cosine_distance: 0.2      # deep-sort-realtime default; never set in code
  embedder: mobilenet
  min_box_size: 10
  include_unmatched_tracks: true
sampling:
  target_fps: 12
  embed_every: 3
osnet:
  weights: models/osnet_campus_v1.pth.tar
  version: osnet-v1
irra:
  weights: models/irra_v1.pth
  version: irra-v1
scoring:
  top_fraction: 0.5
  base_threshold: 0.65
  relative_margin: 0.1
  frame_threshold_ratio: 0.9
